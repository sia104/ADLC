[project]
name = "adlc-bootstrap"
version = "0.6.0"
description = "Bootstrap installer for the reusable ADLC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
adlc-bootstrap = "adlc_bootstrap.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
strict = true
